    <hr>

    <h1>Form Pendaftaran Akun</h1>

    <!-- ===== Form Pendaftaran ===== -->
    <form action="#" method="post">
        <fieldset>
            <legend>Daftar Akun</legend>
            <p>
                <label for="nama">Nama Lengkap:</label>
                <input type="text" id="nama" name="nama" required>
            </p>

            <hr>

            <p>
                Jenis Kelamin:
                <input type="radio" id="laki" name="jenis_kelamin" value="Laki-Laki" required>
                <label for="laki">Laki-Laki</label>
                <input type="radio" id="perempuan" name="jenis_kelamin" value="Perempuan">
                <label for="perempuan">Perempuan</label>
            </p>

            <hr>

            <p>
                <label for="tempat_lahir">Tempat Lahir:</label>
                <input type="text" id="tempat_lahir" name="tempat_lahir" required>
            </p>

            <hr>

            <p>
                <label for="tanggal_lahir">Tanggal Lahir:</label>
                <input type="date" id="tanggal_lahir" name="tanggal_lahir" required>
            </p>

            <hr>

            <p>
                <label for="agama">Agama:</label>
                <select id="agama" name="agama" required>
                    <option value="">--- Pilih Agama ---</option>
                    <option value="Islam">Islam</option>
                    <option value="Katolik">Katolik</option>
                    <option value="Protestan">Protestan</option>
                    <option value="Hindu">Hindu</option>
                    <option value="Buddha">Buddha</option>
                    <option value="Konghucu">Konghucu</option>
                </select>
            </p>

            <hr>

            <p>
                Hobi:
                <input type="checkbox" id="olahraga" name="hobi" value="Olahraga">
                <label for="olahraga">Olahraga</label>
                <input type="checkbox" id="membaca" name="hobi" value="Membaca">
                <label for="membaca">Membaca</label>
                <input type="checkbox" id="ngoding" name="hobi" value="Ngoding">
                <label for="ngoding">Ngoding</label>
            </p>

            <hr>

            <p>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </p>

            <hr>

            <p>
                <input type="checkbox" id="setuju" name="setuju" required>
                <label for="setuju">Dengan mendaftar saya setuju dengan Ketentuan dan Kebijakan Privasi Aplikasi.</label>
            </p>

            <hr>

            <p>
                <input type="reset" value="Reset">
                <input type="submit" value="Submit">
            </p>

        </fieldset>
    </form>

    </main>

</body>
